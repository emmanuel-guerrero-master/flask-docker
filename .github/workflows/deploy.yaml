name: Build, Push and Deploy Flask App

on:
  push:
    branches: [ master ]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    - name: Iniciar sesión en Docker Hub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Construir imagen Docker
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-python:latest .

    - name: Subir imagen a Docker Hub
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-python:latest

    - name: Configurar acceso a K3s
      run: |
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    - name: Desplegar en K3s
      run: |
        kubectl set image deployment/mi-app mi-app=${{ secrets.DOCKERHUB_USERNAME }}/mi-app-python:latest --record || \
        kubectl apply -f k8s/
        kubectl rollout status deployment/mi-app

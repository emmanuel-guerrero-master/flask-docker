name: Build, Push and Deploy Flask App

on:
  push:
    branches: [ master ]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
    # Checkout del repositorio
    - name: Checkout del repositorio
      uses: actions/checkout@v3

    #  Iniciar sesión en Docker Hub
    - name: Iniciar sesión en Docker Hub
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    #  Construir imagen Docker
    - name: Construir imagen Docker
      run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-python:latest .

    #  Subir imagen a Docker Hub
    - name: Subir imagen a Docker Hub
      run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mi-app-python:latest

    #  Configurar acceso a K3s
    - name: Configurar acceso a K3s
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > $HOME/.kube/config
        chmod 600 $HOME/.kube/config

    # Desplegar en K3s
    - name: Desplegar en K3s
      run: |
        # Actualizar imagen si el deployment ya existe, si no aplicar manifiestos
        kubectl set image deployment/mi-app mi-app=${{ secrets.DOCKERHUB_USERNAME }}/mi-app-python:latest --record || \
        kubectl apply -f k8s/
        kubectl rollout status deployment/mi-app

